services:
  - type: web
    name: prepmap-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --threads 4 --timeout 180
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
      - key: PREPMAP_DB
        value: /tmp/prepmap.db
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false
