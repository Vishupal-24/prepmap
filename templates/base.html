<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PrepMap{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}">PrepMap</a>
    <nav>
      <a href="{{ url_for('share') }}">Share your story</a>
      <a href="{{ url_for('eval_page') }}">How well it works</a>
    </nav>
  </header>
  {% if demo %}
  <div class="banner">Public demo with sample data. Real stories stay on a local machine with local Gemma.</div>
  {% endif %}
  <main>{% block body %}{% endblock %}</main>
  <footer>Model: {{ model }} · Every claim links back to the sentence it came from.</footer>
</body>
</html>
